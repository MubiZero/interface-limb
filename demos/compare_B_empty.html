    font-size: 0.9375rem;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  /* every crumb segment is a real target: hover background, focus ring, press */
  .crumb-link {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-1) var(--space-2);
    margin: calc(var(--space-1) * -1) 0;
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font: inherit;
    text-decoration: none;
    cursor: pointer;
    transition: background-color var(--dur-short) var(--ease-standard),
                color var(--dur-short) var(--ease-standard);
  }
  .crumb-link:hover { background: rgba(24,24,27,0.05); color: var(--text); }
  .crumb-link:active { background: rgba(24,24,27,0.09); }
  .crumb-link:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  /* current page: same hover affordance, but marked as where you are */
  .crumb-link[aria-current=&quot;page&quot;] { color: var(--text); font-weight: 600; }
  .crumb .mark {
    display: grid;
    place-items: center;
    width: 26px; height: 26px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    box-shadow: 0 1px 2px rgba(10,114,82,0.35);
    transition: transform var(--dur-short) var(--ease-standard);
  }
  .crumb-link:hover .mark { transform: scale(1.04); }
  .crumb .mark svg { width: 15px; height: 15px; }
  .crumb .sep { color: var(--text-muted); font-weight: 400; }

  .topbar-actions { display: inline-flex; align-items: center; gap: var(--space-3); }

  /* Search: a single control that grows from a pill into an input.
     Width animates, the icon stays put, the field takes focus on open. */
  .search {
    position: relative;
    display: inline-flex;
    align-items: center;
    height: 34px;
    width: 116px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: text;
    overflow: hidden;
    transition: width var(--dur-medium) var(--ease-standard),
                border-color var(--dur-short) var(--ease-standard),
                box-shadow var(--dur-short) var(--ease-standard);
  }
  .search:hover { border-color: var(--border-strong); }
  .search .icon {
    flex: none;
    display: grid;
    place-items: center;
    width: 34px; height: 34px;
    color: var(--text-muted);
    pointer-events: none;
  }
  .search .icon svg { width: 16px; height: 16px; }
  /* collapsed label sits in flow; the input is hidden until opened */
  .search .label {
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .search input {
    flex: 1;
    min-width: 0;
    width: 0;
    height: 100%;
    /* breathing room so the caret/text never hug the icon or the right wall */
    padding: 0 var(--space-3) 0 var(--space-2);
    border: 0;
    background: transparent;
    font: inherit;
    font-size: 0.875rem;
    color: var(--text);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-short) var(--ease-standard);
  }
  .search input::placeholder { color: var(--text-muted); }

  /* open state: wider, soft accent ring, input live, static label gone */
  .search.is-open {
    width: 268px;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search.is-open .label { display: none; }
  .search.is-open input {
    opacity: 1;
    pointer-events: auto;
  }

  @media (prefers-reduced-motion: reduce) {
    .search { transition: border-color 1ms, box-shadow 1ms; }
  }

  /* Main content area: centered empty state */
  main {
    display: grid;
    place-items: center;
    padding: var(--space-12) var(--space-6);
  }

  .empty {
    width: 100%;
    max-width: 460px;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: var(--space-12) var(--space-10) var(--space-10);
    animation: rise var(--dur-medium) var(--ease-enter) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Illustration: stacked-layers folder, the scan anchor */
  .art {
    width: 84px; height: 84px;
    margin: 0 auto var(--space-6);
    border-radius: var(--radius-md);
    display: grid;
    place-items: center;
    background:
      linear-gradient(180deg, #ffffff 0%, var(--accent-soft) 100%);
    border: 1px solid rgba(15, 155, 110, 0.18);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.9),
      0 6px 16px rgba(15, 155, 110, 0.12);
    position: relative;
  }
  .art svg { width: 40px; height: 40px; color: var(--accent); }
  /* a small status dot to read as &quot;ready to fill&quot; */
  .art::after {
    content: &quot;&quot;;
    position: absolute;
    right: -5px; bottom: -5px;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    background-image:
      radial-gradient(circle, var(--accent) 0 4px, transparent 5px);
    box-shadow: 0 2px 6px rgba(24,24,27,0.10);
  }

  .empty h1 {
    margin: 0 0 var(--space-3);
    font-family: &#x27;Space Grotesk&#x27;, system-ui, sans-serif;
    font-weight: 600;
    font-size: 1.5rem;       /* ~24px, modular 1.25 from 16 base */
    line-height: 1.2;
    letter-spacing: -0.02em;
    color: var(--text);
    text-wrap: balance;
  }

  .empty p {
    margin: 0 auto var(--space-8);
    max-width: 38ch;
    font-size: 0.9375rem;
    line-height: 1.55;
    color: var(--text-secondary);
    text-wrap: pretty;
  }

  /* Primary CTA — all six microstates */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    min-height: 44px;
    padding: 0 var(--space-6);
    border: none;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: #ffffff;
    font: inherit;
    font-weight: 700;
    font-size: 0.9375rem;
    letter-spacing: -0.005em;
    cursor: pointer;
    box-shadow: var(--shadow-btn);
    transition:
      transform var(--dur-short) var(--ease-standard),
      background-color var(--dur-short) var(--ease-standard),
      box-shadow var(--dur-short) var(--ease-standard);
  }
  .btn-primary svg { width: 18px; height: 18px; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:focus-visible {
    outline: none;
    box-shadow:
      var(--shadow-btn),
      0 0 0 2px var(--surface),
      0 0 0 4px var(--accent-ring);
  }
  .btn-primary:active {
    background: var(--accent-active);
    transform: scale(0.975);
    box-shadow: var(--shadow-btn-active);
  }

  /* Secondary, quieter path so primary keeps the strongest contrast.
     Separated from the CTA by generous space alone — no divider line, which
     would stretch past the centered button and read as a stray rule.
     Scoped under .empty so this margin wins over the generic `.empty p` rule
     (otherwise its higher specificity zeroes the gap and the link sticks to
     the button). */
  .empty .alt {
    margin: var(--space-10) 0 0;
    font-size: 0.875rem;
    color: var(--text-muted);
  }
  .alt a {
    color: var(--text-secondary);
    font-weight: 500;
    text-decoration: none;
    border-bottom: 1px solid var(--border-strong);
    padding-bottom: 1px;
    transition: color var(--dur-short) var(--ease-standard),
                border-color var(--dur-short) var(--ease-standard);
    border-radius: 2px;
  }
  .alt a:hover { color: var(--accent); border-color: var(--accent); }
  .alt a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-color: transparent;
  }

  @media (prefers-reduced-motion: reduce) {
    .empty { animation: none; }
    * { transition-duration: 1ms !important; }
  }

  @media (max-width: 540px) {
    .topbar { padding: var(--space-4) var(--space-5); }
    .topbar-actions .label { display: none; }
    .empty { padding: var(--space-10) var(--space-6) var(--space-8); }
  }
&lt;/style&gt;

              &lt;path d=&quot;M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z&quot;/&gt;

  &lt;script&gt;
    // Search: open on click/focus, give focus to the field, collapse on
    // Escape or on blur when left empty. The field is the source of truth.
    (function () {
      var box = document.getElementById(&#x27;search&#x27;);
      var input = box.querySelector(&#x27;input&#x27;);
      function open() {
        box.classList.add(&#x27;is-open&#x27;);
        input.focus();
      }
      function maybeClose() {
        if (input.value.trim() === &#x27;&#x27;) box.classList.remove(&#x27;is-open&#x27;);
      }
      box.addEventListener(&#x27;click&#x27;, open);
      input.addEventListener(&#x27;keydown&#x27;, function (e) {
        if (e.key === &#x27;Escape&#x27;) { input.value = &#x27;&#x27;; box.classList.remove(&#x27;is-open&#x27;); input.blur(); }
      });
      input.addEventListener(&#x27;blur&#x27;, maybeClose);
    })();
  &lt;/script&gt;
