<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Neutral product palette, faint cool tint toward the brand hue */
    --bg:        oklch(0.985 0.003 255);
    --surface:   oklch(1 0 0);
    --surface-2: oklch(0.975 0.004 255);
    --border:    oklch(0.915 0.006 255);
    --border-2:  oklch(0.875 0.008 255);
    --ink:       oklch(0.255 0.012 260);
    --ink-2:     oklch(0.455 0.012 260);
    --muted:     oklch(0.555 0.011 260);

    /* Accent: a measured indigo, used only for the primary action + focus */
    --accent:        oklch(0.545 0.165 268);
    --accent-hover:  oklch(0.495 0.168 268);
    --accent-soft:   oklch(0.955 0.028 268);
    --accent-ink:    oklch(0.46 0.16 268);
    --ring:          oklch(0.62 0.16 268 / 0.45);

    --radius: 12px;
    --radius-lg: 16px;
    --shadow-sm: 0 1px 2px oklch(0.2 0.03 260 / 0.05);
    --shadow-md: 0 4px 16px oklch(0.2 0.03 260 / 0.06), 0 1px 3px oklch(0.2 0.03 260 / 0.05);

    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    background-color: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "cv05" 1, "ss01" 1;
  }

  /* ---- App shell (just enough chrome to read as "main content area") ---- */
  .app {
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 56px;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 600;
    font-size: 0.9375rem;
    letter-spacing: -0.01em;
  }

  .brand .mark {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: linear-gradient(150deg, var(--accent), oklch(0.6 0.17 290));
    display: grid;
    place-items: center;
    color: #fff;
    box-shadow: var(--shadow-sm);
  }
  .brand .mark svg { width: 15px; height: 15px; }

  .topbar .divider {
    width: 1px;
    height: 22px;
    background: var(--border-2);
  }

  .crumb {
    font-size: 0.875rem;
    color: var(--muted);
    font-weight: 450;
  }

  .topbar .spacer { flex: 1; }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent-ink);
    display: grid;
    place-items: center;
    font-size: 0.75rem;
    font-weight: 600;
    border: 1px solid var(--border);
  }

  /* ---- Content header row ---- */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 22px 24px;
    border-bottom: 1px solid var(--border);
  }

  .page-head h1 {
    font-size: 1.0625rem;
    font-weight: 600;
    letter-spacing: -0.015em;
  }

  .page-head .count {
    margin-left: 8px;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 999px;
    vertical-align: middle;
  }

  .ghost-btn {
    font: inherit;
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--border-2);
    border-radius: 9px;
    padding: 7px 13px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    transition: background 0.15s var(--ease), border-color 0.15s var(--ease), color 0.15s var(--ease);
  }
  .ghost-btn:hover { background: var(--surface-2); border-color: var(--muted); color: var(--ink); }
  .ghost-btn svg { width: 14px; height: 14px; }

  /* ---- The empty state itself ---- */
  .empty-wrap {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 48px 24px 72px;
  }

  .empty {
    width: 100%;
    max-width: 460px;
    text-align: center;
  }

  /* Illustration: stacked "project" cards forming, on a soft dotted field */
  .illu {
    position: relative;
    width: 168px;
    height: 132px;
    margin: 0 auto 28px;
  }

  .illu .field {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at center, var(--accent-soft), transparent 68%);
    opacity: 0.9;
  }

  .illu .dots {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background-image: radial-gradient(var(--border-2) 1.1px, transparent 1.1px);
    background-size: 13px 13px;
    -webkit-mask-image: radial-gradient(circle at center, #000 38%, transparent 72%);
            mask-image: radial-gradient(circle at center, #000 38%, transparent 72%);
    opacity: 0.7;
  }

  .card-stack {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
  }

  .proj-card {
    position: absolute;
    width: 116px;
    border-radius: 11px;
    background: var(--surface);
    border: 1px solid var(--border-2);
    box-shadow: var(--shadow-md);
    padding: 11px 12px;
  }

  .proj-card.back {
    transform: translateY(-22px) rotate(-7deg) scale(0.92);
    opacity: 0.65;
    filter: saturate(0.6);
  }
  .proj-card.mid {
    transform: translateY(-2px) rotate(4deg) scale(0.96);
    opacity: 0.85;
  }
  .proj-card.front {
    transform: translateY(16px);
    z-index: 2;
  }

  .proj-card .dot {
    width: 16px; height: 16px;
    border-radius: 5px;
    margin-bottom: 9px;
  }
  .proj-card.front .dot { background: var(--accent); }
  .proj-card.mid .dot   { background: oklch(0.7 0.13 200); }
  .proj-card.back .dot  { background: oklch(0.78 0.12 70); }

  .proj-card .line {
    height: 5px;
    border-radius: 3px;
    background: var(--border-2);
  }
  .proj-card .line + .line { margin-top: 6px; }
  .proj-card .line.short { width: 58%; }

  /* The animated "plus" badge that lands on the front card */
  .illu .plus {
    position: absolute;
    z-index: 3;
    right: 14px;
    bottom: 6px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: grid;
    place-items: center;
    box-shadow: 0 6px 14px var(--ring);
    border: 2px solid var(--surface);
  }
  .illu .plus svg { width: 15px; height: 15px; }

  .empty h2 {
    font-size: 1.375rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--ink);
    text-wrap: balance;
  }

  .empty p {
    margin: 10px auto 0;
    max-width: 38ch;
    font-size: 0.9375rem;
    line-height: 1.55;
    color: var(--ink-2);
    text-wrap: pretty;
  }

  .actions {
    margin-top: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    font: inherit;
    font-weight: 500;
    font-size: 0.875rem;
    border-radius: 10px;
    padding: 10px 18px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: transform 0.12s var(--ease), background 0.15s var(--ease),
                border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 15px; height: 15px; }

  .btn-primary {
    color: #fff;
    background: var(--accent);
    border: 1px solid transparent;
    box-shadow: 0 1px 2px oklch(0.4 0.16 268 / 0.35), 0 4px 12px var(--ring);
  }
  .btn-primary:hover { background: var(--accent-hover); }

  .btn-secondary {
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border-2);
  }
  .btn-secondary:hover { background: var(--surface-2); border-color: var(--muted); }

  :where(button, a):focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }

  /* Subtle helper hint under the actions */
  .hint {
    margin-top: 22px;
    font-size: 0.8125rem;
    color: var(--muted);
  }
  .hint kbd {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.75rem;
    background: var(--surface);
    border: 1px solid var(--border-2);
    border-bottom-width: 2px;
    border-radius: 6px;
    padding: 1px 6px;
    color: var(--ink-2);
  }

  /* ---- Entrance motion ---- */
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes plus-pop {
    0%   { opacity: 0; transform: scale(0.4) translateY(6px); }
    60%  { opacity: 1; transform: scale(1.06) translateY(0); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  .empty > * { animation: rise 0.55s var(--ease) both; }
  .empty .illu { animation-delay: 0.02s; }
  .empty h2    { animation-delay: 0.10s; }
  .empty p     { animation-delay: 0.16s; }
  .empty .actions { animation-delay: 0.22s; }
  .empty .hint    { animation-delay: 0.28s; }

  .illu .plus { animation: plus-pop 0.5s var(--ease) 0.5s both; }

  @media (prefers-reduced-motion: reduce) {
    .empty > *, .illu .plus { animation: none !important; }
  }

  @media (max-width: 520px) {
    .page-head { padding: 18px 16px; }
    .empty-wrap { padding: 36px 18px 56px; }
    .crumb { display: none; }
    .topbar .divider { display: none; }
  }
</style>
</head>
<body>
  <div class="app">
    <!-- minimal app chrome so the empty state reads as the main content area -->
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 7l8-4 8 4-8 4-8-4z" fill="currentColor" opacity=".95"/><path d="M4 12l8 4 8-4M4 17l8 4 8-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        Northwind
      </div>
      <span class="divider" aria-hidden="true"></span>
      <span class="crumb">Workspace</span>
      <div class="spacer"></div>
      <div class="avatar" title="Mubin">MZ</div>
    </header>

    <main class="content">
      <div class="page-head">
        <h1>Projects <span class="count">0</span></h1>
        <button class="ghost-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Search
        </button>
      </div>

      <section class="empty-wrap">
        <div class="empty">
          <div class="illu" aria-hidden="true">
            <span class="field"></span>
            <span class="dots"></span>
            <div class="card-stack">
              <div class="proj-card back">
                <span class="dot"></span>
                <span class="line"></span>
                <span class="line short"></span>
              </div>
              <div class="proj-card mid">
                <span class="dot"></span>
                <span class="line"></span>
                <span class="line short"></span>
              </div>
              <div class="proj-card front">
                <span class="dot"></span>
                <span class="line"></span>
                <span class="line short"></span>
              </div>
            </div>
            <span class="plus">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            </span>
          </div>

          <h2>Start your first project</h2>
          <p>Projects keep your tasks, files, and teammates in one place. Create one to get going, or import an existing repository.</p>

          <div class="actions">
            <button class="btn btn-primary" type="button">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
              New project
            </button>
            <button class="btn btn-secondary" type="button">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v11m0 0l-4-4m4 4l4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 17v2a2 2 0 002 2h10a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              Import
            </button>
          </div>

          <p class="hint">Or press <kbd>N</kbd> anywhere to create one.</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
