name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-check (versions, links, reference map, evals, scripts)
        run: bash skills/interface-limb/scripts/check.sh
      - name: Compare pages are up to date
        run: |
          node demos/build_compare.mjs
          git diff --exit-code demos/
